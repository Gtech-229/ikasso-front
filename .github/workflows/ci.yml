# Checks every push to main and every pull request (feature 19): lint, the
# production build and the production image. Deploy (deploy.yml) refuses a
# commit whose CI run did not pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API's internal URL on the VPS. lib/env.ts requires a valid URL and
    # the rewrite is baked into the build; nothing calls it during the build.
    env:
      API_URL: http://api:3000
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The image the VPS runs (README "Production"); built only, never pushed.
      - name: Build the production image
        run: docker build --build-arg API_URL="$API_URL" -t ikasso-admin:ci .
